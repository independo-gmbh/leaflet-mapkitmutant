# Allow esbuild (used by tsup) to run its install/build script.
allowBuilds:
  esbuild: true
overrides:
  # The backmerge plugin hard-depends on semantic-release@^22, which drags in a
  # stale, vulnerable plugin tree. It only imports lib/get-git-auth-url.js,
  # which is unchanged in the semantic-release version we use.
  "@saithodev/semantic-release-backmerge>semantic-release": "^25.0.9"
auditConfig:
  ignoreGhsas:
    # braces stack-exhaustion DoS: no patched release exists yet (3.0.3 is
    # latest). Only reached via micromatch in the semantic-release toolchain
    # with patterns from our own release config. Remove once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
